name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages deployment
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"amtsbriefe.de","key":"a1235c5efafc60bf8e2284fa29c3aa9a","keyLocation":"https://amtsbriefe.de/a1235c5efafc60bf8e2284fa29c3aa9a.txt","urlList":%s}' "$urls")
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
