pastnote:{de:"Die Frist ist vorbei. Lass dich trotzdem beraten: In manchen Fällen hilft ein „Überprüfungsantrag“ oder „Wiedereinsetzung in den vorigen Stand“.",tr:"Süre dolmuş. Yine de danışmanlık al: Bazı durumlarda „Überprüfungsantrag“ (yeniden inceleme başvurusu) veya „Wiedereinsetzung in den vorigen Stand“ işe yarar.",bg:"Срокът е изтекъл. Все пак потърсете консултация: понякога помага „Überprüfungsantrag“ или „Wiedereinsetzung in den vorigen Stand“.",ar:"انتهت المهلة. استشر رغم ذلك: في بعض الحالات يفيد «Überprüfungsantrag» (طلب مراجعة) أو «Wiedereinsetzung in den vorigen Stand» (إعادة المهلة).",uk:"Строк минув. Все одно зверніться по консультацію: іноді допомагає «Überprüfungsantrag» або «Wiedereinsetzung in den vorigen Stand».",pl:"Termin minął. Mimo to skorzystaj z porady: czasem pomaga „Überprüfungsantrag” lub „Wiedereinsetzung in den vorigen Stand”.",en:"The deadline has passed. Get advice anyway: sometimes an “Überprüfungsantrag” (review request) or “Wiedereinsetzung in den vorigen Stand” (reinstatement) helps.",ku:"Dem qediya. Dîsa jî şêwrê bistîne: carinan „Überprüfungsantrag“ an „Wiedereinsetzung in den vorigen Stand“ alîkar e."},

n_post:{de:"Bei einem normalen Brief gilt der Bescheid am 4. Tag nach dem Datum als erhalten (Regel seit 2025). Kam er nachweislich später an, zählt der spätere Tag – heb den Umschlag auf.",tr:"Normal mektupta karar, üzerindeki tarihten sonraki 4. gün alınmış sayılır (2025'ten beri). Daha geç geldiği kanıtlanabilirse geç gün sayılır – zarfı sakla.",bg:"При обикновено писмо решението се счита за получено на 4-тия ден след датата (от 2025 г.). Ако доказуемо е пристигнало по-късно, важи по-късният ден – пазете плика.",ar:"في الرسالة العادية يُعتبر القرار مستلَماً في اليوم الرابع بعد تاريخه (قاعدة منذ 2025). إذا وصل متأخراً وأمكن إثبات ذلك يُحتسب اليوم الأحدث – احتفظ بالظرف.",uk:"Для звичайного листа рішення вважається отриманим на 4-й день після дати (правило з 2025 р.). Якщо воно доказово прийшло пізніше, рахується пізніший день – збережіть конверт.",pl:"Przy zwykłym liście decyzję uważa się za doręczoną 4. dnia po dacie (zasada od 2025 r.). Jeśli udowodnisz, że przyszła później, liczy się późniejszy dzień – zachowaj kopertę.",en:"For an ordinary letter the decision counts as received on the 4th day after its date (rule since 2025). If it provably arrived later, the later day counts – keep the envelope.",ku:"Di nameya asayî de biryar roja 4an piştî dîroka xwe wek wergirtî tê hesibandin (ji 2025an ve). Heke were îspatkirin ku dereng hatiye, roja dereng tê hesibandin – zerfê biparêze."},
n_1y:{de:"Fehlt die Rechtsbehelfsbelehrung oder ist sie falsch, hast du in der Regel 1 Jahr Zeit. Warte trotzdem nicht unnötig.",tr:"Rechtsbehelfsbelehrung yoksa ya da yanlışsa genelde 1 yıl süren vardır. Yine de boşuna bekleme.",bg:"Ако указанието за обжалване липсва или е грешно, обикновено имате 1 година. Все пак не чакайте излишно.",ar:"إذا كانت معلومات حق الاعتراض غير موجودة أو خاطئة، فلديك عادةً سنة كاملة. مع ذلك لا تنتظر بلا داعٍ.",uk:"Якщо роз'яснення про оскарження немає або воно хибне, зазвичай у вас є 1 рік. Але не зволікайте без потреби.",pl:"Jeśli brakuje pouczenia lub jest błędne, zwykle masz 1 rok. Mimo to nie zwlekaj.",en:"If the instructions on how to object are missing or wrong, you usually have 1 year. Still, don't wait unnecessarily.",ku:"Heke agahiya mafê îtirazê tune be an şaş be, bi gelemperî 1 salê te heye. Dîsa jî bêhewce li bendê nemîne."},
n_ab:{de:"Ausländerbehörde: In vielen Bundesländern gibt es keinen Widerspruch, sondern direkt eine Klage beim Verwaltungsgericht – meist ebenfalls 1 Monat. Was gilt, steht in der Rechtsbehelfsbelehrung.",tr:"Yabancılar Dairesi: Birçok eyalette itiraz (Widerspruch) yoktur, doğrudan idare mahkemesinde dava açılır – genelde yine 1 ay. Hangisinin geçerli olduğu Rechtsbehelfsbelehrung'da yazar.",bg:"Служба за чужденци: в много провинции няма възражение, а директно жалба до административния съд – обикновено също 1 месец. Какво важи, пише в указанието за обжалване.",ar:"دائرة الأجانب: في كثير من الولايات لا يوجد اعتراض، بل دعوى مباشرة أمام المحكمة الإدارية – غالباً خلال شهر أيضاً. ما ينطبق عليك مكتوب في معلومات حق الاعتراض.",uk:"Відомство у справах іноземців: у багатьох землях немає заперечення, а одразу позов до адмінсуду – зазвичай теж 1 місяць. Що діє, написано в роз'ясненні.",pl:"Urząd ds. cudzoziemców: w wielu landach nie ma odwołania, tylko od razu skarga do sądu administracyjnego – zwykle też 1 miesiąc. Co obowiązuje, jest w pouczeniu.",en:"Immigration office: in many states there is no objection stage but a lawsuit at the administrative court – usually also 1 month. The instructions at the end tell you which applies.",ku:"Fermangeha biyaniyan: li gelek eyaletan îtiraz tune, rasterast doz li dadgeha îdarî tê vekirin – bi gelemperî dîsa 1 meh. Ya derbasdar di Rechtsbehelfsbelehrung de nivîsandî ye."},
n_fa:{de:"Beim Finanzamt heißt es „Einspruch“. Du kannst ihn einfach über ELSTER einreichen.",tr:"Vergi dairesinde buna „Einspruch“ denir. ELSTER üzerinden kolayca gönderebilirsin.",bg:"При данъчната служба се нарича „Einspruch“. Можете да го подадете лесно през ELSTER.",ar:"في مكتب الضرائب يُسمّى «Einspruch». يمكنك تقديمه بسهولة عبر ELSTER.",uk:"У податковій це називається «Einspruch». Його можна легко подати через ELSTER.",pl:"W urzędzie skarbowym to „Einspruch”. Możesz go łatwo złożyć przez ELSTER.",en:"At the tax office it's called “Einspruch”. You can file it easily via ELSTER.",ku:"Li fermangeha bacê jê re „Einspruch“ tê gotin. Tu dikarî bi hêsanî bi ELSTER bişînî."},
n_send:{de:"Der Widerspruch muss schriftlich sein – eine normale E-Mail reicht meist nicht. Sicher: persönlich abgeben und Eingangsstempel auf deine Kopie geben lassen, Fax mit Sendebericht oder Einschreiben.",tr:"İtiraz yazılı olmalı – normal e-posta genelde yetmez. Güvenli yollar: elden teslim edip kopyana giriş damgası vurdur, gönderim raporlu faks veya taahhütlü mektup.",bg:"Възражението трябва да е писмено – обикновен имейл обикновено не стига. Сигурно: лично с входящ печат върху копието ви, факс с отчет или препоръчано писмо.",ar:"يجب أن يكون الاعتراض كتابياً – البريد الإلكتروني العادي لا يكفي غالباً. الطرق الآمنة: التسليم باليد مع ختم الاستلام على نسختك، أو فاكس مع تقرير الإرسال، أو رسالة مسجلة.",uk:"Заперечення має бути письмовим – звичайного e-mail зазвичай недостатньо. Надійно: особисто з вхідним штампом на копії, факс зі звітом або рекомендований лист.",pl:"Odwołanie musi być pisemne – zwykły e-mail zwykle nie wystarcza. Bezpiecznie: osobiście z pieczątką wpływu na kopii, faks z raportem lub list polecony.",en:"The objection must be in writing – a normal e-mail is usually not enough. Safe options: hand it in and get a receipt stamp on your copy, fax with transmission report, or registered mail.",ku:"Îtiraz divê bi nivîskî be – e-nameya asayî bi gelemperî têr nake. Rêyên ewle: bi destan bide û mohra wergirtinê li kopiya xwe bide lêxistin, faks bi rapora şandinê an nameya qeydkirî."},
n_u:{de:"Die 2 Wochen zählen ab dem Einzug. Viele Bürgerämter haben lange Wartezeiten – buche sofort einen Termin. Du brauchst die Wohnungsgeberbestätigung vom Vermieter.",tr:"2 hafta taşındığın günden itibaren sayılır. Birçok Bürgeramt'ta randevu beklemesi uzundur – hemen randevu al. Ev sahibinden Wohnungsgeberbestätigung (ev sahibi onayı) lazım.",bg:"2-те седмици текат от нанасянето. В много служби се чака дълго – запазете час веднага. Нужно ви е удостоверение от наемодателя (Wohnungsgeberbestätigung).",ar:"يُحتسب الأسبوعان من يوم الانتقال. لدى كثير من مكاتب المواطنين انتظار طويل – احجز موعداً فوراً. تحتاج إلى تأكيد المؤجّر (Wohnungsgeberbestätigung).",uk:"2 тижні рахуються від дня заселення. У багатьох Bürgeramt довго чекати – записуйтесь одразу. Потрібне підтвердження від орендодавця (Wohnungsgeberbestätigung).",pl:"2 tygodnie liczą się od wprowadzenia. W wielu urzędach długo się czeka – umów termin od razu. Potrzebujesz potwierdzenia od wynajmującego (Wohnungsgeberbestätigung).",en:"The 2 weeks count from the move-in day. Many offices have long waits – book an appointment right away. You need the landlord's confirmation (Wohnungsgeberbestätigung).",ku:"2 hefte ji roja barkirinê tên hejmartin. Li gelek Bürgeramtan dem dirêj e – zû randevûyê bigire. Ji xwedanmalê Wohnungsgeberbestätigung lazim e."},
n_u2:{de:"Bekommst du keinen Termin rechtzeitig: Buche den frühesten Termin und heb die Bestätigung auf – das zeigt, dass du dich gekümmert hast.",tr:"Zamanında randevu alamazsan: En erken randevuyu al ve onay mailini sakla – ilgilendiğini gösterir.",bg:"Ако не получите час навреме: запазете най-ранния и пазете потвърждението – то показва, че сте се погрижили.",ar:"إذا لم تحصل على موعد في الوقت المناسب: احجز أقرب موعد واحتفظ بالتأكيد – فهو يثبت أنك تابعت الأمر.",uk:"Якщо вчасно не вдається записатися: візьміть найближчий термін і збережіть підтвердження – це показує, що ви подбали.",pl:"Jeśli nie dostaniesz terminu na czas: zarezerwuj najwcześniejszy i zachowaj potwierdzenie – to pokazuje, że się postarałeś.",en:"Can't get an appointment in time? Book the earliest one and keep the confirmation – it shows you acted.",ku:"Heke di wextê de randevû nebînî: ya herî zû bigire û pejirandinê biparêze – ev nîşan dide ku te xwe pê re mijûl kiriye."},
n_f:{de:"Gilt für Führerscheine aus Ländern außerhalb von EU/EWR. Danach darfst du in Deutschland damit nicht mehr fahren. Die Umschreibung dauert oft Wochen – beantrage sie früh. EU-Führerscheine gelten weiter.",tr:"AB/AEA dışı ülkelerin ehliyetleri için geçerli. Bu tarihten sonra Almanya'da o ehliyetle araç kullanamazsın. Değişim çoğu zaman haftalar sürer – erken başvur. AB ehliyetleri geçerli kalır.",bg:"Важи за книжки от държави извън ЕС/ЕИП. След това не можете да карате с нея в Германия. Подмяната често отнема седмици – подайте рано. Книжките от ЕС остават валидни.",ar:"ينطبق على رخص الدول من خارج الاتحاد الأوروبي/المنطقة الاقتصادية الأوروبية. بعد ذلك لا يجوز لك القيادة بها في ألمانيا. التحويل يستغرق غالباً أسابيع – قدّم مبكراً. رخص الاتحاد الأوروبي تبقى صالحة.",uk:"Стосується посвідчень із країн поза ЄС/ЄЕЗ. Після цього в Німеччині з ним керувати не можна. Заміна часто триває тижні – подавайте заздалегідь. Посвідчення ЄС діють далі.",pl:"Dotyczy praw jazdy spoza UE/EOG. Potem nie wolno ci nim jeździć w Niemczech. Wymiana trwa często tygodnie – złóż wniosek wcześnie. Prawa jazdy z UE pozostają ważne.",en:"Applies to licences from outside the EU/EEA. After that you may no longer drive with it in Germany. Conversion often takes weeks – apply early. EU licences stay valid.",ku:"Ji bo ehliyetên welatên derveyî YE/EEA derbasdar e. Piştî vê tu nikarî li Almanyayê pê bajoyî. Guhertin pir caran hefteyan dikişîne – zû serlêdan bike. Ehliyetên YE derbasdar dimînin."},
n_f2:{de:"Wir rechnen vorsichtig mit einem Tag weniger. Wenn du nachweisen kannst, dass du höchstens 12 Monate bleibst, kann die Führerscheinstelle um bis zu 6 Monate verlängern.",tr:"Güvenli olsun diye bir gün eksik hesaplıyoruz. En fazla 12 ay kalacağını kanıtlayabilirsen Führerscheinstelle süreyi 6 aya kadar uzatabilir.",bg:"Смятаме предпазливо с един ден по-малко. Ако докажете, че оставате най-много 12 месеца, службата може да удължи срока с до 6 месеца.",ar:"نحسب بحذر بيوم أقل. إذا أثبتّ أنك ستبقى 12 شهراً كحد أقصى، يمكن لمكتب رخص القيادة التمديد حتى 6 أشهر.",uk:"Ми рахуємо обережно – на один день менше. Якщо доведете, що пробудете щонайбільше 12 місяців, відомство може продовжити до 6 місяців.",pl:"Liczymy ostrożnie o jeden dzień mniej. Jeśli udowodnisz, że zostajesz maksymalnie 12 miesięcy, urząd może przedłużyć o do 6 miesięcy.",en:"We count cautiously with one day less. If you can show you'll stay 12 months at most, the licence office can extend by up to 6 months.",ku:"Em bi baldarî rojekê kêmtir dihesibînin. Heke tu îspat bikî ku herî zêde 12 mehan dimînî, Führerscheinstelle dikare heta 6 mehan dirêj bike."},
n_j:{de:"Die Meldung geht auch online bei der Agentur für Arbeit. Wer zu spät meldet, riskiert eine Sperrzeit von 1 Woche beim Arbeitslosengeld.",tr:"Bildirim İş Ajansı'na online da yapılabilir. Geç bildirim yapan, işsizlik parasında 1 haftalık kesinti (Sperrzeit) riskiyle karşılaşır.",bg:"Регистрацията може и онлайн в Агенцията по труда. При закъснение рискувате 1 седмица без обезщетение (Sperrzeit).",ar:"يمكن التسجيل أيضاً عبر الإنترنت لدى وكالة العمل. من يتأخر يخاطر بإيقاف إعانة البطالة لمدة أسبوع (Sperrzeit).",uk:"Зареєструватися можна й онлайн в Агентстві праці. За запізнення – ризик тижневого блокування допомоги (Sperrzeit).",pl:"Zgłoszenia można dokonać też online w Agencji Pracy. Za spóźnienie grozi tydzień bez zasiłku (Sperrzeit).",en:"You can also register online with the employment agency. Registering late risks a 1-week block on unemployment benefit (Sperrzeit).",ku:"Qeyd dikare bi înternetê jî li Ajansa Kar were kirin. Yê ku dereng qeyd bike, xetera 1 hefte rawestandina pereyê bêkariyê (Sperrzeit) heye."},
n_j3:{de:"Zwischen „davon erfahren“ und Arbeitsende liegen weniger als 3 Monate – deshalb gilt: innerhalb von 3 Tagen melden.",tr:"Öğrendiğin gün ile işin bitişi arasında 3 aydan az var – bu yüzden 3 gün içinde bildirmelisin.",bg:"Между узнаването и края на работата има по-малко от 3 месеца – затова: регистрация до 3 дни.",ar:"بين يوم علمك ونهاية العمل أقل من 3 أشهر – لذلك يجب التسجيل خلال 3 أيام.",uk:"Між тим, як дізналися, і кінцем роботи менше 3 місяців – тому треба зареєструватися протягом 3 днів.",pl:"Między dowiedzeniem się a końcem pracy są mniej niż 3 miesiące – dlatego zgłoś się w ciągu 3 dni.",en:"Less than 3 months lie between finding out and the job ending – so you must register within 3 days.",ku:"Di navbera pêhesiyanê û dawiya kar de kêmtirî 3 mehan heye – ji ber vê di nav 3 rojan de qeyd bike."},
n_jbad:{de:"Bitte prüfe die Daten: Das Arbeitsende liegt vor dem Tag, an dem du davon erfahren hast.",tr:"Lütfen tarihleri kontrol et: İşin bitişi, öğrendiğin günden önce görünüyor.",bg:"Моля, проверете датите: краят на работата е преди деня, в който сте научили.",ar:"يرجى التحقق من التواريخ: نهاية العمل تقع قبل يوم علمك بها.",uk:"Перевірте дати: кінець роботи раніше за день, коли ви дізналися.",pl:"Sprawdź daty: koniec pracy jest przed dniem, w którym się dowiedziałeś.",en:"Please check the dates: the job end is before the day you found out.",ku:"Ji kerema xwe dîrokan kontrol bike: dawiya kar berî roja pêhesiyanê ye."},
safe:{de:"Wir rechnen immer zur sicheren Seite: Im Zweifel zeigen wir den früheren Tag.",tr:"Hep güvenli tarafta hesaplıyoruz: Şüphede erken günü gösteriyoruz.",bg:"Винаги смятаме в безопасна посока: при съмнение показваме по-ранния ден.",ar:"نحسب دائماً بحذر: عند الشك نعرض اليوم الأبكر.",uk:"Ми завжди рахуємо з запасом: у разі сумніву показуємо раніший день.",pl:"Zawsze liczymy ostrożnie: w razie wątpliwości pokazujemy wcześniejszy dzień.",en:"We always calculate on the safe side: when in doubt, we show the earlier day.",ku:"Em her tim bi ewlehî dihesibînin: di gumanê de roja zûtir nîşan didin."},

empty:{de:"Gib ein Datum ein – hier erscheint dein letzter Tag.",tr:"Bir tarih gir – son günün burada görünecek.",bg:"Въведете дата – тук ще се появи последният ви ден.",ar:"أدخل تاريخاً – سيظهر آخر يوم لك هنا.",uk:"Введіть дату – тут з'явиться ваш останній день.",pl:"Wpisz datę – tutaj pojawi się twój ostatni dzień.",en:"Enter a date – your last day will appear here.",ku:"Dîrokekê binivîse – roja te ya dawî li vir xuya dibe."},

r1:{de:["4-Tage-Regel","Ein Bescheid per Post gilt am 4. Tag nach dem Datum als bekannt gegeben."],tr:["4 gün kuralı","Postayla gelen karar, tarihten sonraki 4. gün tebliğ edilmiş sayılır."],bg:["Правило на 4-те дни","Решение по пощата се счита за съобщено на 4-тия ден след датата."],ar:["قاعدة الأيام الأربعة","القرار المرسل بالبريد يُعتبر مُبلَّغاً في اليوم الرابع بعد تاريخه."],uk:["Правило 4 днів","Рішення поштою вважається оголошеним на 4-й день після дати."],pl:["Zasada 4 dni","Decyzja pocztą uważa się za doręczoną 4. dnia po dacie."],en:["4-day rule","A decision sent by post counts as notified on the 4th day after its date."],ku:["Qaîdeya 4 rojan","Biryara bi postê roja 4an piştî dîrokê wek ragihandî tê hesibandin."]},
r2:{de:["1 Monat","Die Frist endet am Tag mit derselben Zahl im nächsten Monat (31.1. → 28./29.2.)."],tr:["1 ay","Süre bir sonraki ayda aynı sayılı günde biter (31.1. → 28./29.2.)."],bg:["1 месец","Срокът изтича в деня със същото число през следващия месец (31.1. → 28./29.2.)."],ar:["شهر واحد","تنتهي المهلة في اليوم الذي يحمل الرقم نفسه في الشهر التالي (31.1 ← 28/29.2)."],uk:["1 місяць","Строк закінчується в день з тим самим числом наступного місяця (31.1. → 28./29.2.)."],pl:["1 miesiąc","Termin kończy się w dniu o tym samym numerze w następnym miesiącu (31.1. → 28./29.2.)."],en:["1 month","The deadline ends on the day with the same number in the next month (31 Jan → 28/29 Feb)."],ku:["1 meh","Dem di meha din de di roja bi heman hejmarê de diqede (31.1. → 28./29.2.)."]},
r3:{de:["Wochenende & Feiertag","Fällt das Ende auf Samstag, Sonntag oder einen Feiertag, gilt der nächste Werktag."],tr:["Hafta sonu ve tatil","Son gün cumartesi, pazar veya resmî tatile denk gelirse bir sonraki iş günü geçerlidir."],bg:["Почивни и празнични дни","Ако краят е събота, неделя или празник, важи следващият работен ден."],ar:["نهاية الأسبوع والعطل","إذا وقع آخر يوم في سبت أو أحد أو عطلة رسمية، يُعتمد يوم العمل التالي."],uk:["Вихідні та свята","Якщо кінець припадає на суботу, неділю чи свято, діє наступний робочий день."],pl:["Weekend i święta","Jeśli koniec wypada w sobotę, niedzielę lub święto, obowiązuje następny dzień roboczy."],en:["Weekends & holidays","If the end falls on a Saturday, Sunday or public holiday, the next working day counts."],ku:["Dawiya hefteyê û betlane","Heke dawî bikeve şemî, yekşem an betlaneyê, roja kar a din derbasdar e."]},
r4:{de:["Ohne Belehrung: 1 Jahr","Fehlt die Rechtsbehelfsbelehrung, verlängert sich die Frist in der Regel auf 1 Jahr."],tr:["Bilgilendirme yoksa: 1 yıl","Rechtsbehelfsbelehrung yoksa süre genelde 1 yıla uzar."],bg:["Без указание: 1 година","Ако липсва указание за обжалване, срокът обикновено е 1 година."],ar:["بدون معلومات الاعتراض: سنة","إذا غابت معلومات حق الاعتراض تمتد المهلة عادةً إلى سنة."],uk:["Без роз'яснення: 1 рік","Якщо роз'яснення немає, строк зазвичай подовжується до 1 року."],pl:["Bez pouczenia: 1 rok","Jeśli brak pouczenia, termin zwykle wydłuża się do 1 roku."],en:["No instructions: 1 year","If the instructions on how to object are missing, the deadline is usually 1 year."],ku:["Bê agahî: 1 sal","Heke agahiya mafê îtirazê tune be, dem bi gelemperî dibe 1 sal."]},
disc:{de:"Allgemeine Hilfe, keine Rechtsberatung, ohne Gewähr. Im Zweifel: Beratungsstelle, Sozialverband oder Anwalt. Deine Eingaben bleiben in deinem Browser.",tr:"Genel yardımdır, hukuki danışmanlık değildir, garanti verilmez. Şüphede: danışma merkezi, sosyal dernek veya avukat. Girdiğin bilgiler tarayıcında kalır.",bg:"Обща помощ, не е правна консултация, без гаранция. При съмнение: консултантски център, социална организация или адвокат. Данните остават във вашия браузър.",ar:"مساعدة عامة وليست استشارة قانونية ودون ضمان. عند الشك: مركز استشارات أو جمعية اجتماعية أو محامٍ. تبقى بياناتك في متصفحك.",uk:"Загальна допомога, не юридична консультація, без гарантій. У разі сумніву: консультаційний центр, соціальна організація або адвокат. Ваші дані залишаються у браузері.",pl:"Ogólna pomoc, nie porada prawna, bez gwarancji. W razie wątpliwości: poradnia, organizacja społeczna lub adwokat. Twoje dane zostają w przeglądarce.",en:"General help, not legal advice, no guarantee. When in doubt: an advice centre, welfare association or lawyer. Your entries stay in your browser.",ku:"Alîkariya giştî ye, ne şêwra hiqûqî ye, bê garantî. Di gumanê de: navenda şêwrê, komeleya civakî an parêzer. Agahiyên te di gerokê te de dimînin."},

/* ---------- date helpers (UTC, no time-zone surprises) ---------- */
const D=(y,m,d)=>new Date(Date.UTC(y,m-1,d));
const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?D(+m[1],+m[2],+m[3]):null};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);
const dim=(y,m0)=>new Date(Date.UTC(y,m0+1,0)).getUTCDate();
function addMonths(d,n){const y=d.getUTCFullYear(),m=d.getUTCMonth()+n; const ny=y+Math.floor(m/12), nm=((m%12)+12)%12; return new Date(Date.UTC(ny,nm,Math.min(d.getUTCDate(),dim(ny,nm))));}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return D(y,mo,da);}
/* Only holidays valid in the whole state are counted (partial ones are left out → earlier, safer date). */
function holidays(y,land){
  const E=easter(y), H={};
  const add=(d,n)=>{H[iso(d)]=n};
  add(D(y,1,1),"Neujahr"); add(addDays(E,-2),"Karfreitag"); add(addDays(E,1),"Ostermontag"); add(D(y,5,1),"Tag der Arbeit");
  add(addDays(E,39),"Christi Himmelfahrt"); add(addDays(E,50),"Pfingstmontag"); add(D(y,10,3),"Tag der Deutschen Einheit");
  add(D(y,12,25),"1. Weihnachtstag"); add(D(y,12,26),"2. Weihnachtstag");
  const has=l=>l.includes(land);
  if(has(["Baden-Württemberg","Bayern","Sachsen-Anhalt"])) add(D(y,1,6),"Heilige Drei Könige");
  if(has(["Berlin","Mecklenburg-Vorpommern"])) add(D(y,3,8),"Internationaler Frauentag");
  if(has(["Baden-Württemberg","Bayern","Hessen","Nordrhein-Westfalen","Rheinland-Pfalz","Saarland"])) add(addDays(E,60),"Fronleichnam");
  if(has(["Saarland"])) add(D(y,8,15),"Mariä Himmelfahrt");
  if(has(["Thüringen"])) add(D(y,9,20),"Weltkindertag");
  if(has(["Brandenburg","Bremen","Hamburg","Mecklenburg-Vorpommern","Niedersachsen","Sachsen","Sachsen-Anhalt","Schleswig-Holstein","Thüringen"])) add(D(y,10,31),"Reformationstag");
  if(has(["Baden-Württemberg","Bayern","Nordrhein-Westfalen","Rheinland-Pfalz","Saarland"])) add(D(y,11,1),"Allerheiligen");
  if(has(["Sachsen"])){const n=D(y,11,23); let d=addDays(n,-1); while(d.getUTCDay()!==3) d=addDays(d,-1); add(d,"Buß- und Bettag");}
  return H;
}
function holName(d,land){return holidays(d.getUTCFullYear(),land)[iso(d)]||null}
/* § 64 Abs. 3 SGG / § 193 BGB: Saturday, Sunday or holiday → next working day */
function shiftEnd(d,land){let why=null,x=d; while(true){const w=x.getUTCDay(), h=holName(x,land); if(w===0||w===6||h){ if(!why) why={day:x,hol:h}; x=addDays(x,1);} else break;} return {date:x,why};}
function today(){const n=new Date(); return D(n.getFullYear(),n.getMonth()+1,n.getDate());}
function wd(d){ if(lang==="ku") return WD.ku[d.getUTCDay()]; return new Intl.DateTimeFormat(LOC[lang],{weekday:"long",timeZone:"UTC"}).format(d); }
const fmt=d=>{const p=n=>String(n).padStart(2,"0"); return p(d.getUTCDate())+"."+p(d.getUTCMonth()+1)+"."+d.getUTCFullYear();};
const cap=s=>s.charAt(0).toLocaleUpperCase()+s.slice(1);

/* ---------- state ---------- */
let lang="de", kase="b", st={from:"jc",how:"post",rbb:"y",bdate:"",move:"",res:"",end:"",know:""}, land="";
try{lang=localStorage.getItem("bb-lang")||lang; land=localStorage.getItem("bb-land")||"";}catch(e){}
if(!LANGS.some(l=>l[0]===lang)) lang="de";
if(!LANDS.includes(land)) land="";
{const t=iso(today()); st.bdate=t; st.move=t; st.res=t; st.know=t;}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seg(key,opts,stack){return `<div class="seg${stack?" stack":""}" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${key}" data-v="${v}" aria-pressed="${st[key]===v}">${esc(l)}</button>`).join("")}</div>`;}
function dateField(key,label){return `<label class="f"><span>${esc(label)}</span><input type="date" data-k="${key}" value="${esc(st[key])}" min="2000-01-01" max="2100-12-31"></label>`;}
function landField(){return `<label class="f"><span>${esc(T(S.land,lang))}</span><select id="landsel"><option value="">${esc(T(S.pick,lang))}</option>${LANDS.map(l=>`<option${l===land?" selected":""}>${l}</option>`).join("")}</select>${land?"":`<p class="hint">${esc(T(S.nolandhint,lang))}</p>`}</label>`;}

function renderStatic(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=T(S.title,lang)+" – Amtsbriefe";
  $("langs").innerHTML=LANGS.map(([c,n])=>`<button type="button" data-lang="${c}" aria-pressed="${c===lang}" lang="${c}">${n}</button>`).join("");
  $("t-back").textContent=T(S.back,lang); $("t-k1").textContent=T(S.k1,lang); $("t-k2").textContent=T(S.k2,lang);
  const h=T(S.h1,lang); $("t-h1").innerHTML=esc(h[0])+"<span>"+esc(h[1])+"</span>";
  $("t-sub").textContent=T(S.sub,lang);
  $("t-s1").innerHTML="<b>1</b>"+esc(T(S.s1,lang)); $("t-s2").innerHTML="<b>2</b>"+esc(T(S.s2,lang));
  $("cases").innerHTML=CASES.map(([k,c])=>`<button type="button" class="case" style="--c:${c}" data-case="${k}" aria-pressed="${k===kase}"><span class="ic">${ICON[k]}</span><span><b lang="${lang}">${esc(T(S["c_"+k],lang))}</b><small>${esc(T(S["c_"+k+"d"],lang))}</small></span></button>`).join("");
  $("t-howh").textContent=T(S.howh,lang);
  $("rules").innerHTML=["r1","r2","r3","r4"].map((k,i)=>{const r=T(S[k],lang);return `<div class="rule"><b>${esc(r[0])}</b><p>${esc(r[1])}</p><code dir="ltr">${["§ 37 SGB X · § 41 VwVfG · § 122 AO","§ 64 SGG · § 188 BGB","§ 64 Abs. 3 SGG · § 193 BGB","§ 66 SGG · § 58 VwGO"][i]}</code></div>`}).join("");
  $("t-disc").textContent=T(S.disc,lang);
}
function renderFields(){
  let h="";
  if(kase==="b"){
    h+=`<label class="f"><span>${esc(T(S.from,lang))}</span><select id="fromsel">${OFF.map(([v,n])=>`<option value="${v}"${v===st.from?" selected":""}>${esc(v==="x"?T(S.other,lang):n)}</option>`).join("")}</select></label>`;
    h+=`<div class="f"><span>${esc(T(S.how,lang))}</span>${seg("how",[["post",T(S.post,lang)],["hand",T(S.hand,lang)]],true)}</div>`;
    h+=dateField("bdate",st.how==="post"?T(S.bdate,lang):T(S.hdate,lang));
    h+=`<div class="f"><span>${esc(T(S.rbb,lang))}</span>${seg("rbb",[["y",T(S.yes,lang)],["n",T(S.no,lang)]])}</div>`;
    h+=landField();
  } else if(kase==="u"){ h+=dateField("move",T(S.move,lang)); }
  else if(kase==="f"){ h+=dateField("res",T(S.res,lang)); }
  else { h+=dateField("end",T(S.end,lang))+dateField("know",T(S.know,lang)); }
  $("fields").innerHTML=h;
}
function pill(end){
  const n=Math.round((end-today())/864e5);
  if(n<0) return {t:T(S.past,lang).replace("{n}",-n),c:"#8A8FB0",n};
  if(n===0) return {t:T(S.today,lang),c:"#FF6B4A",n};
  if(n===1) return {t:T(S.left1,lang),c:"#FF6B4A",n};
  return {t:T(S.left,lang).replace("{n}",n),c:n<=3?"#FF6B4A":n<=14?"#FFC23C":"#14BF8F",n};
}
function compute(){
  if(kase==="b"){
    const d=parse(st.bdate); if(!d) return null;
    const known=st.how==="post"?addDays(d,4):d;
    const raw=addMonths(known,st.rbb==="y"?1:12);
    const s=shiftEnd(raw,land);
    const tl=[];
    if(st.how==="post"){ tl.push([T(S.tl_date,lang),d,""]); tl.push([T(S.tl_known,lang),known,"mid"]); }
    else tl.push([T(S.tl_hand,lang),d,"mid"]);
    tl.push([T(S.tl_end,lang),s.date,"end"]);
    const notes=[];
    if(s.why) notes.push(["shift",T(S.shift,lang).replace("{x}",(s.why.hol?s.why.hol+" ("+T(S.hol,lang)+")":wd(s.why.day))+", "+fmt(s.why.day))]);
    if(st.how==="post") notes.push(["",T(S.n_post,lang)]);
    if(st.rbb==="n") notes.push(["",T(S.n_1y,lang)]);
    if(st.from==="ab") notes.push(["warn",T(S.n_ab,lang)]);
    if(st.from==="fa") notes.push(["",T(S.n_fa,lang)]);
    notes.push(["",T(S.n_send,lang)]);
    const L=LETTER[st.from];
    return {end:s.date,label:T(S.last,lang),tl,notes,link:L?`index.html#brief=${L}&bdate=${fmt(d)}`:"index.html",cal:T(S.c_b,lang)};
  }
  if(kase==="u"){
    const d=parse(st.move); if(!d) return null;
    const end=addDays(d,14);
    return {end,label:T(S.last,lang),tl:[[T(S.tl_move,lang),d,"mid"],[T(S.tl_reg,lang),end,"end"]],notes:[["",T(S.n_u,lang)],["",T(S.n_u2,lang)]],link:"index.html#brief=r5",cal:T(S.c_u,lang)};
  }
  if(kase==="f"){
    const d=parse(st.res); if(!d) return null;
    const end=addDays(addMonths(d,6),-1), apply=addMonths(d,3);
    const tl=[[T(S.tl_res,lang),d,"mid"]]; tl.push([T(S.tl_apply,lang),apply,""]); tl.push([T(S.tl_fsend,lang),end,"end"]);
    return {end,label:T(S.lastfs,lang),tl,notes:[["",T(S.n_f,lang)],["",T(S.n_f2,lang)]],link:"index.html#brief=fs1",cal:T(S.c_f,lang)};
  }
  const e=parse(st.end), k=parse(st.know); if(!e||!k) return null;
  if(e<k) return {err:T(S.n_jbad,lang)};
  const lim=addMonths(e,-3); let end, short=false;
  if(k<=lim) end=lim; else {end=addDays(k,3); short=true;}
  if(end>e) end=e;
  const tl=[[T(S.tl_know,lang),k,""],[T(S.tl_meld,lang),end,"end"],[T(S.tl_alo,lang),addDays(e,1),"mid"]];
  tl.sort((a,b)=>a[1]-b[1]);
  const notes=[]; if(short) notes.push(["warn",T(S.n_j3,lang)]); notes.push(["",T(S.n_j,lang)]);
  return {end,label:T(S.last,lang),tl,notes,link:`index.html#brief=a3&enddate=${fmt(e)}`,cal:T(S.c_j,lang)};
}
let last=null;
function renderResult(){
  const r=compute(); last=r;
  const box=$("result");
  if(!r){ box.innerHTML=`<div class="empty"><svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="40" rx="6"/><path d="M10 26h44M22 8v10M42 8v10"/><path d="M24 38l6 6 12-12"/></svg>${esc(T(S.empty,lang))}</div>`; return; }
  if(r.err){ box.innerHTML=`<div class="rbody"><ul class="notes"><li class="warn">${esc(r.err)}</li></ul></div>`; return; }
  const p=pill(r.end), c=CASES.find(x=>x[0]===kase)[2];
  const notes=[...r.notes]; if(p.n<0) notes.unshift(["warn",T(S.pastnote,lang)]);
  box.innerHTML=`<div class="rtop" style="--h:${c}"><div class="lbl">${esc(r.label)}</div><div class="big" dir="ltr">${fmt(r.end)}</div><div class="wd">${esc(cap(wd(r.end)))}</div><span class="pill" style="--pc:${p.c}"><i></i>${esc(p.t)}</span></div>
  <div class="rbody">
    <ol class="tl">${r.tl.map(([l,d,cl])=>`<li class="${cl}"><small>${esc(l)}</small><b><bdi dir="ltr">${fmt(d)}</bdi> · ${esc(cap(wd(d)))}</b></li>`).join("")}</ol>
    <ul class="notes">${notes.map(([cl,t])=>`<li class="${cl}">${esc(t)}</li>`).join("")}<li>${esc(T(S.safe,lang))}</li></ul>
    <div class="acts">${p.n>=0?`<button type="button" class="btn" id="ics"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>${esc(T(S.ics,lang))}</button>`:""}<a class="btn ghost" href="${esc(r.link)}"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>${esc(T(S.letter,lang))}</a></div>
  </div>`;
}
function render(){renderStatic(); renderFields(); renderResult();}

function downloadIcs(){
  if(!last||!last.end) return;
  const d=iso(last.end).replace(/-/g,""), d2=iso(addDays(last.end,1)).replace(/-/g,"");
  const now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const txt=s=>s.replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//amtsbriefe.de//Fristen-Rechner//DE","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+d+"-"+kase+"-"+Math.random().toString(36).slice(2)+"@amtsbriefe.de","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+d2,
    "SUMMARY:"+txt("⏰ "+T(S.tl_end,lang)+": "+last.cal),"DESCRIPTION:"+txt(T(S.title,lang)+" – amtsbriefe.de"),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+txt(T(S.icsrem,lang)),"TRIGGER:-P3D","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="frist-"+iso(last.end)+".ics";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.lang){lang=b.dataset.lang; try{localStorage.setItem("bb-lang",lang)}catch(x){} render(); return;}
  if(b.dataset.case){kase=b.dataset.case; render(); return;}
  if(b.dataset.seg){st[b.dataset.seg]=b.dataset.v; renderFields(); renderResult(); return;}
  if(b.id==="ics") downloadIcs();
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k; if(k){st[k]=e.target.value; renderResult();}});
document.addEventListener("change",e=>{
  if(e.target.id==="landsel"){land=e.target.value; try{localStorage.setItem("bb-land",land)}catch(x){} renderFields(); renderResult();}
  if(e.target.id==="fromsel"){st.from=e.target.value; renderResult();}
});
render();
</script>
<script data-goatcounter="https://amtsbriefede.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
