disc:{de:"Einfache Erklärungen ohne Gewähr, keine Rechtsberatung. Maßgeblich ist immer dein Brief und das Gesetz.",tr:"Basit açıklamalardır, garanti verilmez, hukuki danışmanlık değildir. Her zaman mektubun ve kanun esastır.",bg:"Опростени обяснения без гаранция, не е правна консултация. Важат писмото ви и законът.",ar:"شروح مبسطة دون ضمان، وليست استشارة قانونية. المرجع دائماً رسالتك والقانون.",uk:"Прості пояснення без гарантій, не юридична консультація. Головне – ваш лист і закон.",pl:"Proste wyjaśnienia bez gwarancji, nie porada prawna. Decyduje zawsze twoje pismo i prawo.",en:"Simple explanations, no guarantee, not legal advice. Your letter and the law always prevail.",ku:"Ravekirinên hêsan in, bê garantî, ne şêwra hiqûqî ne. Her tim nameya te û qanûn bingeh in."},
title:{de:"Amtsdeutsch-Wörterbuch",tr:"Resmî Almanca sözlüğü",bg:"Речник на административния немски",ar:"قاموس لغة الدوائر الألمانية",uk:"Словник канцелярської німецької",pl:"Słownik urzędowego niemieckiego",en:"Official German dictionary",ku:"Ferhenga almaniya fermî"}
};
const T=(o,l)=>o[l]??o.de;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=w=>w.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/\(.*?\)/g,"").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/-$/,"").toLowerCase();
const norm=s=>s.toLocaleLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss");
const catOf=k=>CATS.find(c=>c[0]===k);
let lang="de", cat="", q="";
try{lang=localStorage.getItem("bb-lang")||lang}catch(e){}
if(!LANGS.some(l=>l[0]===lang)) lang="de";
const ICO={pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'};

function dayIndex(){const n=new Date(); return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5)%W.length;}
function card(w){
  const c=catOf(w.c), gl=lang==="de"?"":(w.g[lang]||"");
  const de=lang==="de"?"":`<p class="de"><b>${esc(T(S.inde,lang))}</b> <span dir="ltr" lang="de">${esc(w.d.de)}</span></p>`;
  const acts=[];
  if(w.l) acts.push(`<a class="main" href="index.html#brief=${w.l}">${ICO.pen}${esc(T(S.letter,lang))}</a>`);
  if(w.f) acts.push(`<a href="frist-rechner.html">${ICO.clock}${esc(T(S.frist,lang))}</a>`);
  acts.push(`<button type="button" data-share="${slug(w.w)}">${ICO.link}${esc(T(S.share,lang))}</button>`);
  return `<article class="card" id="${slug(w.w)}" style="--c:${c[2]}" lang="de">
    <div class="top"><h2 dir="ltr"><small>${w.a}</small>${esc(w.w)}</h2><span class="tag" lang="${lang}">${esc(T(c[1],lang))}</span></div>
    ${gl?`<p class="gloss" lang="${lang}">${esc(gl)}</p>`:""}
    <p lang="${lang}">${esc(T(w.d,lang))}</p>${de}
    <blockquote class="ex"><span lang="${lang}">${esc(T(S.ex,lang))}</span><q dir="ltr" lang="de">„${esc(w.x)}“</q></blockquote>
    <div class="acts" lang="${lang}">${acts.join("")}</div></article>`;
}
function list(){
  const n=norm(q.trim());
  return W.filter(w=>(!cat||w.c===cat)&&(!n||norm([w.w,w.g[lang]||"",T(w.d,lang),w.d.de].join(" ")).includes(n)))
          .sort((a,b)=>a.w.localeCompare(b.w,"de"));
}
function renderGrid(){
  const L=list();
  $("count").textContent=T(S.count,lang).replace("{n}",L.length);
  $("grid").innerHTML=L.length?L.map(card).join(""):`<div class="empty">${esc(T(S.none,lang))}</div>`;
}
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=T(S.title,lang)+" – Amtsbriefe";
  $("langs").innerHTML=LANGS.map(([c,n])=>`<button type="button" data-lang="${c}" aria-pressed="${c===lang}" lang="${c}">${n}</button>`).join("");
  ["back","k1","sub","ctah","ctap","ctab","disc"].forEach(k=>$("t-"+k).textContent=T(S[k],lang));
  const h=T(S.h1,lang); $("t-h1").innerHTML=esc(h[0])+"<span>"+esc(h[1])+"</span>";
  $("q").placeholder=T(S.q,lang); $("q").setAttribute("aria-label",T(S.q,lang));
  const w=W[dayIndex()];
  $("wotd").innerHTML=`<div class="lbl">${esc(T(S.wotd,lang))}</div><div class="w" lang="de" dir="ltr"><small>${w.a}</small>${esc(w.w)}</div>${lang==="de"?"":`<div class="g">${esc(w.g[lang]||"")}</div>`}<p>${esc(T(w.d,lang))}</p><a href="#${slug(w.w)}" data-jump="${slug(w.w)}">${esc(T(S.more,lang))} ↓</a>`;
  $("chips").innerHTML=[["",S.all,"var(--ink)"],...CATS].map(([k,n,c])=>`<button type="button" data-cat="${k}" style="--c:${c}" aria-pressed="${k===cat}">${k?"<i></i>":""}${esc(T(n,lang))}<b>${k?W.filter(w=>w.c===k).length:W.length}</b></button>`).join("");
  renderGrid();
}
function jump(id){
  const el=$(id); if(!el){cat="";q="";$("q").value="";renderGrid();}
  const e=$(id); if(!e) return;
  e.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  e.classList.add("hit"); setTimeout(()=>e.classList.remove("hit"),2400);
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  if(b.dataset.lang){lang=b.dataset.lang; try{localStorage.setItem("bb-lang",lang)}catch(x){} render(); return;}
  if(b.dataset.cat!==undefined){cat=b.dataset.cat; render(); return;}
  if(b.dataset.jump){e.preventDefault(); history.replaceState(null,"","#"+b.dataset.jump); jump(b.dataset.jump); return;}
  if(b.dataset.share){const u=location.origin+location.pathname+"#"+b.dataset.share;
    const ok=()=>toast(T(S.copied,lang));
    try{navigator.clipboard.writeText(u).then(ok,()=>prompt("",u))}catch(x){prompt("",u)}}
});
$("q").addEventListener("input",e=>{q=e.target.value; renderGrid();});
const fixTop=()=>{document.querySelector('.tools').style.top=document.querySelector('header.top').offsetHeight+'px'}; addEventListener('resize',fixTop);
render(); fixTop();
if(location.hash.length>1) setTimeout(()=>jump(decodeURIComponent(location.hash.slice(1))),60);
</script>
<script data-goatcounter="https://amtsbriefede.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
